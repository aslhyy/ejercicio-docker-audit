name: CI/CD Security Pipeline

on:
  push:
    branches:
      - main

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Pytest
        run: pytest -v


  bandit:
    name: Bandit
    needs: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: pip install bandit

      - name: Ejecutar Bandit
        run: bandit app.py


  build:
    name: Build Docker
    needs: bandit
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ejercicio-docker-audit:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ejercicio-docker-audit:latest .

      - name: Publicar imagen
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ejercicio-docker-audit:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ejercicio-docker-audit:latest


  trivy:
    name: Trivy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Escanear imagen
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/ejercicio-docker-audit:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  deploy:
    name: Deploy EC2
    needs: trivy
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ejercicio-docker-audit
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
